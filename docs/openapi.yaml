openapi: 3.1.0
info:
  title: ETH Fund Trace API
  version: 1.0.0
  description: Ethereum-only read-only fund tracing API. Known cross-chain bridge contracts are terminal classifications; cross-chain analysis is not supported.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    Chain:
      name: chain
      in: query
      required: true
      schema: {type: string, enum: [ethereum]}
    ObjectID:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: '^[0-9a-f]{24}$'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
    AsyncJob:
      type: object
      properties:
        jobId: {type: string}
        traceJobId: {type: string}
        status: {type: string}
    Label:
      type: object
      required: [chain, address, type, source]
      properties:
        id: {type: string, readOnly: true}
        chain: {type: string, enum: [ethereum]}
        address: {type: string}
        type: {type: string}
        source: {type: string, enum: [manual, public-list]}
        riskLevel: {type: string, enum: [low, medium, high]}
        confidence: {type: number, minimum: 0, maximum: 1}
        note: {type: string}
        evidence: {type: array, items: {type: string}}
    TraceNode:
      type: object
      required: [chain, address, depth, terminal, addressType]
      properties:
        chain: {type: string, enum: [ethereum]}
        address: {type: string}
        depth: {type: integer}
        terminal: {type: boolean}
        stopReason: {type: string, enum: [terminal, cross_chain_bridge, unsupported_contract, high_frequency, ambiguous_conversion, missing_data, cycle, no_matching_transfers, node_limit]}
        addressType: {type: string, enum: [unknown, eoa, contract]}
        protocol: {type: string}
        roles: {type: array, items: {type: string}}
    TraceEdge:
      type: object
      required: [chain, from, to, asset, totalAmount, transferCount, kind, depth]
      properties:
        chain: {type: string, enum: [ethereum]}
        from: {type: string}
        to: {type: string}
        asset: {type: string}
        totalAmount: {type: string}
        transferCount: {type: integer}
        kind: {type: string}
        depth: {type: integer}
        path: {type: array, items: {type: string}}
        conversionEvidence: {type: array, items: {type: object}}
    Risk:
      type: object
      required: [score, level, ruleVersion]
      properties:
        score: {type: integer, minimum: 0, maximum: 100}
        level: {type: string, enum: [known_high, suspected, no_conclusion]}
        evidence: {type: array, items: {type: object}}
        ruleVersion: {type: string, const: direct-label-v1}
    TraceResult:
      type: object
      required: [nodes, edges, dataThroughBlock, dataStatus, risk, ruleVersion]
      properties:
        nodes: {type: array, items: {$ref: '#/components/schemas/TraceNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/TraceEdge'}}
        paths: {type: array, items: {type: array, items: {type: string}}}
        dataThroughBlock: {type: integer}
        dataStatus: {type: string}
        labels: {type: array, items: {$ref: '#/components/schemas/Label'}}
        risk: {$ref: '#/components/schemas/Risk'}
        ruleVersion: {type: string, const: trace-v1}
    TraceJob:
      type: object
      required: [id, chain, seedAddress, direction, depth, asset, status]
      properties:
        id: {type: string}
        chain: {type: string, enum: [ethereum]}
        seedAddress: {type: string}
        direction: {type: string, enum: [in, out, both]}
        depth: {type: integer}
        asset: {type: string}
        status: {type: string, enum: [queued, waiting_sync, running, succeeded, partial, failed, stopped]}
        result: {$ref: '#/components/schemas/TraceResult'}
        ruleVersion: {type: string, const: trace-v1}
        errorCode: {type: string}
        error: {type: string}
        retryable: {type: boolean}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses: {'200': {description: Healthy}}
  /api/v1/sync:
    post:
      summary: Queue an Ethereum address history sync
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                chain: {type: string, enum: [ethereum], default: ethereum}
                address: {type: string}
                startBlock: {type: integer, default: 21525891}
                endBlock: {type: integer, default: 25860787, description: Fixed production snapshot cutoff.}
                neighborLimit: {type: integer, minimum: 0, maximum: 10}
      responses: {'202': {description: Sync accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AsyncJob'}}}}}
  /api/v1/sync-jobs/latest:
    get:
      responses: {'200': {description: Latest matching sync job}}
  /api/v1/sync-jobs/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ObjectID'}]
      responses: {'200': {description: Sync job}, '404': {description: Job not found}}
  /api/v1/addresses/{address}:
    get:
      parameters:
        - {name: address, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Chain'}
      responses: {'200': {description: Address metadata}}
  /api/v1/addresses/{address}/profile:
    get:
      parameters:
        - {name: address, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Chain'}
      responses: {'200': {description: Address activity profile}}
  /api/v1/addresses/{address}/balance:
    get:
      parameters:
        - {name: address, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Chain'}
      responses: {'200': {description: Current on-chain balance and observation block}}
  /api/v1/edges:
    get:
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: string}}
        - {name: direction, in: query, required: true, schema: {type: string, enum: [in, out]}}
        - {name: asset, in: query, schema: {type: string}}
      responses: {'200': {description: Transfer facts}}
  /api/v1/trace:
    get:
      summary: Queue a trace-v1 analysis
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string, enum: [in, out, both]}}
        - {name: depth, in: query, deprecated: true, schema: {type: integer, minimum: 0}, description: Automatic terminal tracing; legacy positive values are accepted but normalized to 0.}
        - {name: asset, in: query, schema: {type: string}}
      responses: {'202': {description: Trace accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AsyncJob'}}}}}
  /api/v1/trace-jobs/latest:
    get:
      responses: {'200': {description: Latest matching trace-v1 job}}
  /api/v1/trace-jobs/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ObjectID'}]
      responses: {'200': {description: Trace job, content: {application/json: {schema: {$ref: '#/components/schemas/TraceJob'}}}}, '404': {description: Job not found}}
  /api/v1/trace-jobs/{id}/stop:
    post:
      parameters: [{$ref: '#/components/parameters/ObjectID'}]
      responses: {'200': {description: Trace stopped}, '404': {description: Job not found}}
  /api/v1/trace-jobs/{id}/extensions:
    post:
      summary: Manually expand one visible trace node without a frontend hop limit
      parameters: [{$ref: '#/components/parameters/ObjectID'}]
      responses: {'202': {description: Extension accepted}}
  /api/v1/trace-jobs/{id}/extensions/latest:
    get:
      parameters: [{$ref: '#/components/parameters/ObjectID'}]
      responses: {'200': {description: Latest extension job}}
  /api/v1/risk:
    get:
      summary: Queue trace-v1 with direct-label-only risk evaluation
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: string}}
      responses: {'202': {description: Trace accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AsyncJob'}}}}}
  /api/v1/transactions/{txHash}:
    get:
      parameters:
        - {name: txHash, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/Chain'}
      responses: {'200': {description: Transaction semantics}}
  /api/v1/labels:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Label'}}}}
      responses: {'201': {description: Label upserted}}
    get:
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Direct deterministic labels}}
