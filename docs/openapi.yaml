openapi: 3.1.0
info:
  title: ETH Fund Trace API
  version: 1.0.0
  description: Ethereum and Base read-only fund tracing API.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
    AsyncJob:
      type: object
      properties:
        jobId: {type: string}
        traceJobId: {type: string}
        status: {type: string}
    SyncProgress:
      type: object
      required: [pagesFetched, recordsRead, recordsWritten, splitCount]
      properties:
        currentAddress: {type: string}
        currentAction: {type: string, enum: [txlist, txlistinternal, tokentx]}
        rangeStart: {type: integer, minimum: 0}
        rangeEnd: {type: integer, minimum: 0}
        currentPage: {type: integer, minimum: 0}
        pagesFetched: {type: integer, minimum: 0}
        recordsRead: {type: integer, minimum: 0, description: Records returned by Etherscan, including records reread after a range split.}
        recordsWritten: {type: integer, minimum: 0, description: Records submitted to idempotent Mongo upserts.}
        splitCount: {type: integer, minimum: 0}
        updatedAt: {type: string, format: date-time}
    SyncJob:
      type: object
      required: [jobId, chain, address, status, totalAddresses, completedAddresses, processedAddresses, cachedAddresses, fetched, retryable]
      properties:
        jobId: {type: string}
        chain: {type: string, enum: [ethereum, base]}
        address: {type: string}
        status: {type: string, enum: [queued, running, succeeded, partial, failed]}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        safeHead: {type: integer, minimum: 0}
        totalAddresses: {type: integer, minimum: 0}
        completedAddresses: {type: integer, minimum: 0}
        processedAddresses: {type: integer, minimum: 0, description: Addresses that reached a terminal success or failure outcome.}
        cachedAddresses: {type: integer, minimum: 0}
        fetched: {type: integer, minimum: 0}
        actionCounts: {type: object, additionalProperties: {type: integer}}
        progress: {$ref: '#/components/schemas/SyncProgress'}
        successfulNeighbors: {type: array, items: {type: string}}
        failedNeighbors: {type: array, items: {type: object}}
        errorCode: {type: string}
        error: {type: string}
        retryable: {type: boolean}
    Label:
      type: object
      required: [chain, address, type, source]
      properties:
        chain: {type: string, enum: [ethereum, base]}
        address: {type: string}
        type: {type: string}
        source: {type: string, enum: [manual, public-list]}
        riskLevel: {type: string, enum: [low, medium, high]}
        confidence: {type: number, minimum: 0, maximum: 1, default: 1}
        note: {type: string}
        evidence: {type: array, items: {type: string}}
    BridgeLink:
      type: object
      required: [sourceChain, sourceTxHash, sourceAddress, sourceAsset, sourceAmount, targetChain, targetTxHash, targetAddress, targetAsset, targetAmount, bridgeAddress, evidence]
      properties:
        sourceChain: {type: string, enum: [ethereum, base]}
        sourceTxHash: {type: string}
        sourceLogIndex: {type: integer, minimum: 0}
        sourceAddress: {type: string}
        targetChain: {type: string, enum: [ethereum, base]}
        targetTxHash: {type: string}
        targetLogIndex: {type: integer, minimum: 0}
        targetAddress: {type: string}
        bridgeAddress: {type: string}
        sourceAsset: {type: string}
        sourceAmount: {type: string}
        targetAsset: {type: string}
        targetAmount: {type: string}
        evidence: {type: array, minItems: 1, items: {type: string}}
    Transfer:
      type: object
      required: [chain, chainId, txHash, blockNumber, from, to, assetType, asset, source, logIndex]
      properties:
        chain: {type: string, enum: [ethereum, base]}
        chainId: {type: integer}
        txHash: {type: string}
        blockNumber: {type: integer}
        blockTime: {type: string, format: date-time}
        from: {type: string}
        to: {type: string}
        assetType: {type: string}
        asset: {type: string}
        symbol: {type: string}
        decimals: {type: integer}
        amount: {type: string, description: Raw integer amount; clients must not convert it to a floating-point number.}
        tokenValue: {type: string}
        tokenName: {type: string}
        transferKind: {type: string, enum: [transfer, mint, burn]}
        tokenMetadataComplete: {type: boolean}
        source: {type: string, enum: [txlist, txlistinternal, tokentx]}
        traceId: {type: string}
        logIndex: {type: integer}
    TraceNode:
      type: object
      required: [chain, address, depth, terminal]
      properties:
        chain: {type: string, enum: [ethereum, base]}
        address: {type: string}
        depth: {type: integer}
        terminal: {type: boolean}
    TraceEdge:
      type: object
      required: [transfer, depth, path]
      properties:
        transfer: {$ref: '#/components/schemas/Transfer'}
        depth: {type: integer}
        path: {type: array, items: {type: string}}
    BridgeEdge:
      type: object
      required: [link, depth, path]
      properties:
        link: {$ref: '#/components/schemas/BridgeLink'}
        depth: {type: integer}
        path:
          type: array
          items:
            type: object
            properties: {chain: {type: string}, address: {type: string}}
    Risk:
      type: object
      required: [score, level, ruleVersion, propagationVersion]
      properties:
        score: {type: integer, minimum: 0, maximum: 100}
        level: {type: string, enum: [known_high, suspected, no_conclusion]}
        inferredLabels: {type: array, items: {$ref: '#/components/schemas/InferredLabel'}}
        evidence: {type: array, items: {$ref: '#/components/schemas/RiskEvidence'}}
        ruleVersion: {type: string, example: risk-v1}
        propagationVersion: {type: string, example: propagation-v1}
    InferredLabel:
      type: object
      required: [address, type, source, confidence, direction, distance, path, txHashes]
      properties:
        address: {type: string}
        type: {type: string}
        source: {type: string, const: propagation}
        confidence: {type: number, minimum: 0, maximum: 1}
        direction: {type: string}
        distance: {type: integer, minimum: 0}
        path: {type: array, items: {type: string}}
        paths: {type: array, items: {type: array, items: {type: string}}}
        txHashes: {type: array, items: {type: string}}
        evidence: {type: array, items: {type: string}}
    RiskEvidence:
      type: object
      required: [address, labelType, baseScore, score, confidence, distance, direction, path, txHashes, rule]
      properties:
        address: {type: string}
        labelType: {type: string}
        baseScore: {type: integer}
        score: {type: integer}
        confidence: {type: number, minimum: 0, maximum: 1}
        distance: {type: integer, minimum: 0}
        direction: {type: string}
        path: {type: array, items: {type: string}}
        txHashes: {type: array, items: {type: string}}
        evidence: {type: array, items: {type: string}}
        rule: {type: string}
    NodeRef:
      type: object
      required: [chain, address]
      properties:
        chain: {type: string, enum: [ethereum, base]}
        address: {type: string}
    TraceResult:
      type: object
      required: [nodes, edges, dataThroughBlock, dataStatus, risk, ruleVersion]
      properties:
        nodes: {type: array, items: {$ref: '#/components/schemas/TraceNode'}}
        edges: {type: array, items: {$ref: '#/components/schemas/TraceEdge'}}
        bridgeEdges: {type: array, items: {$ref: '#/components/schemas/BridgeEdge'}}
        paths: {type: array, items: {type: array, items: {type: string}}}
        crossChainPaths: {type: array, items: {type: array, items: {$ref: '#/components/schemas/NodeRef'}}}
        dataThroughBlock: {type: integer}
        dataThroughBlocks: {type: object, additionalProperties: {type: integer}}
        dataStatus: {type: string}
        labels: {type: array, items: {$ref: '#/components/schemas/InferredLabel'}}
        risk: {$ref: '#/components/schemas/Risk'}
        ruleVersion: {type: string, example: trace-v2}
    TraceJob:
      type: object
      required: [id, chain, seedAddress, direction, depth, topN, asset, status, currentDepth, visitedNodes, edgeCount]
      properties:
        id: {type: string}
        chain: {type: string, enum: [ethereum, base]}
        seedAddress: {type: string}
        direction: {type: string, enum: [in, out, both]}
        depth: {type: integer}
        topN: {type: integer}
        asset: {type: string}
        status: {type: string, enum: [queued, waiting_sync, running, succeeded, partial, failed]}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        currentDepth: {type: integer}
        visitedNodes: {type: integer}
        edgeCount: {type: integer}
        syncJobIds: {type: array, items: {type: string}}
        result: {$ref: '#/components/schemas/TraceResult'}
        dataThroughBlock: {type: integer}
        ruleVersion: {type: string}
        errorCode: {type: string}
        error: {type: string}
        retryable: {type: boolean}
    EdgePage:
      type: object
      required: [items, dataThroughBlock, dataStatus]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Transfer'}}
        nextCursor: {type: string}
        dataThroughBlock: {type: integer}
        dataStatus: {type: string}
    Profile:
      type: object
      required: [chain, address, ruleVersion, dataThroughBlock, features, score, classification]
      properties:
        chain: {type: string, enum: [ethereum, base]}
        address: {type: string}
        ruleVersion: {type: string, example: hot-wallet-v1}
        dataThroughBlock: {type: integer}
        features: {type: object, additionalProperties: {type: integer}}
        score: {type: integer}
        classification: {type: string}
        suspectedHotWallet: {type: boolean}
        signals: {type: array, items: {type: string}}
    TransactionAnalysis:
      type: object
      required: [chain, chainId, txHash, blockNumber, from, to, value, input, succeeded, transfers, swaps, wraps, quality, analyzedAt]
      properties:
        chain: {type: string, enum: [ethereum]}
        chainId: {type: integer, enum: [1]}
        txHash: {type: string, pattern: '^0x[0-9a-fA-F]{64}$'}
        blockNumber: {type: integer, minimum: 0}
        from: {type: string}
        to: {type: string}
        value: {type: string, description: Raw wei as a decimal string.}
        input: {type: string}
        succeeded: {type: boolean}
        entryContract: {type: string}
        entryContractName: {type: string}
        transfers: {type: array, items: {$ref: '#/components/schemas/ReceiptTransfer'}}
        swaps: {type: array, items: {$ref: '#/components/schemas/SwapEvent'}}
        wraps: {type: array, items: {$ref: '#/components/schemas/WrapEvent'}}
        finalOutputAddress: {type: string}
        quality: {$ref: '#/components/schemas/AnalysisQuality'}
        analyzedAt: {type: string, format: date-time}
    ReceiptTransfer:
      type: object
      required: [token, from, to, amount, logIndex]
      properties:
        token: {type: string}
        from: {type: string}
        to: {type: string}
        amount: {type: string}
        logIndex: {type: integer, minimum: 0}
    SwapEvent:
      type: object
      required: [pool, verified, sender, recipient, logIndex, evidence]
      properties:
        pool: {type: string}
        protocol: {type: string, enum: [uniswap]}
        version: {type: string, enum: [v3]}
        verified: {type: boolean}
        sender: {type: string}
        recipient: {type: string}
        tokenIn: {type: string}
        tokenOut: {type: string}
        amountIn: {type: string}
        amountOut: {type: string}
        fee: {type: integer}
        logIndex: {type: integer, minimum: 0}
        outputAddress: {type: string}
        evidence: {type: array, items: {type: string}}
    WrapEvent:
      type: object
      required: [type, account, amount, logIndex, evidence]
      properties:
        type: {type: string, enum: [deposit, withdrawal]}
        account: {type: string}
        amount: {type: string}
        logIndex: {type: integer, minimum: 0}
        evidence: {type: string}
    AnalysisQuality:
      type: object
      required: [status, ambiguousRoute, evidence]
      properties:
        status: {type: string, enum: [complete, partial]}
        ambiguousRoute: {type: boolean}
        evidence: {type: array, items: {type: string}}
        issues: {type: array, items: {type: string}}
  responses:
    BadRequest:
      description: Invalid request
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  parameters:
    ObjectID: {name: id, in: path, required: true, schema: {type: string}}
    AddressPath: {name: address, in: path, required: true, schema: {type: string}}
    Chain: {name: chain, in: query, schema: {type: string, enum: [ethereum, base], default: ethereum}}
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: MongoDB is reachable}
  /api/v1/sync:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                chain: {type: string, enum: [ethereum, base], default: ethereum}
                address: {type: string}
                startBlock: {type: integer, minimum: 0, default: 0}
                neighborLimit: {type: integer, minimum: 0, maximum: 10, default: 10}
      responses:
        '202': {description: Sync job accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AsyncJob'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/transactions/{txHash}:
    get:
      parameters:
        - {name: txHash, in: path, required: true, schema: {type: string, pattern: '^0x[0-9a-fA-F]{64}$'}}
        - {name: chain, in: query, schema: {type: string, enum: [ethereum], default: ethereum}}
      responses:
        '200': {description: Confirmed transaction analysis, content: {application/json: {schema: {$ref: '#/components/schemas/TransactionAnalysis'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Transaction not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Receipt not confirmed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Upstream rate limited, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Upstream unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /api/v1/sync-jobs/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ObjectID'}]
      responses: {'200': {description: Sync job, content: {application/json: {schema: {$ref: '#/components/schemas/SyncJob'}}}}, '404': {description: Job not found}}
  /api/v1/addresses/{address}:
    get:
      parameters: [{$ref: '#/components/parameters/AddressPath'}, {$ref: '#/components/parameters/Chain'}]
      responses: {'200': {description: Address metadata and labels}, '404': {description: Address not discovered}}
  /api/v1/addresses/{address}/profile:
    get:
      parameters: [{$ref: '#/components/parameters/AddressPath'}, {$ref: '#/components/parameters/Chain'}]
      responses: {'200': {description: Versioned address profile, content: {application/json: {schema: {$ref: '#/components/schemas/Profile'}}}}, '409': {description: Address not synced}}
  /api/v1/edges:
    get:
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: array, items: {type: string}}}
        - {name: direction, in: query, schema: {type: string, enum: [in, out, both], default: both}}
        - {name: asset, in: query, schema: {type: string, default: all}}
        - {name: fromBlock, in: query, schema: {type: integer, minimum: 0}}
        - {name: toBlock, in: query, schema: {type: integer, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: cursor, in: query, schema: {type: string}}
      responses: {'200': {description: Stable page of positive fact edges, content: {application/json: {schema: {$ref: '#/components/schemas/EdgePage'}}}}, '409': {description: Address not synced}}
  /api/v1/trace:
    get:
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: string}}
        - {name: direction, in: query, schema: {type: string, enum: [in, out, both], default: both}}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 5, default: 3}}
        - {name: topN, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 10}}
        - {name: asset, in: query, schema: {type: string, default: all}}
      responses:
        '202':
          description: Trace job accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncJob'}
  /api/v1/trace-jobs/{id}:
    get:
      parameters: [{$ref: '#/components/parameters/ObjectID'}]
      responses: {'200': {description: Trace job and persisted result, content: {application/json: {schema: {$ref: '#/components/schemas/TraceJob'}}}}, '404': {description: Job not found}}
  /api/v1/risk:
    get:
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: string}}
        - {name: depth, in: query, schema: {type: integer, minimum: 1, maximum: 5}}
        - {name: topN, in: query, schema: {type: integer, minimum: 1, maximum: 20}}
      responses:
        '202': {description: Asynchronous risk trace accepted, content: {application/json: {schema: {$ref: '#/components/schemas/AsyncJob'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/v1/labels:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Label'}}}}
      responses: {'201': {description: Label upserted}, '400': {$ref: '#/components/responses/BadRequest'} }
    get:
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: string}}
      responses: {'200': {description: Deterministic labels}}
  /api/v1/bridge-links:
    post:
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BridgeLink'}}}}
      responses: {'201': {description: Confirmed bridge link}, '400': {$ref: '#/components/responses/BadRequest'} }
    get:
      parameters:
        - {$ref: '#/components/parameters/Chain'}
        - {name: address, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses: {'200': {description: Confirmed links touching the chain/address node}}
