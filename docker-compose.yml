services:
  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      HTTP_AUTH_DISABLED: "${HTTP_AUTH_DISABLED:-false}"
      HTTP_API_KEY: "${HTTP_API_KEY:-}"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "${MONGO_DATABASE:-eth_fund_trace}"
      ETHERSCAN_API_KEY: "${ETHERSCAN_API_KEY:-}"
      WEB_DIST_DIR: "/app/web/dist"
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
