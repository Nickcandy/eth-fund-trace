services:
  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      HTTP_AUTH_DISABLED: "${HTTP_AUTH_DISABLED:-false}"
      HTTP_API_KEY: "${HTTP_API_KEY:-}"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "${MONGO_DATABASE:-eth_fund_trace}"
      ETHERSCAN_API_KEY: "${ETHERSCAN_API_KEY:-}"
      ETHERSCAN_BASE_URL: "${ETHERSCAN_BASE_URL:-https://api.etherscan.io/v2/api}"
      ETHERSCAN_PAGE_SIZE: "${ETHERSCAN_PAGE_SIZE:-1000}"
      ETHERSCAN_MAX_PAGES: "${ETHERSCAN_MAX_PAGES:-10}"
      ETHERSCAN_REQUESTS_PER_SECOND: "${ETHERSCAN_REQUESTS_PER_SECOND:-3}"
      ETHERSCAN_BURST: "${ETHERSCAN_BURST:-1}"
      ETHERSCAN_MAX_RETRIES: "${ETHERSCAN_MAX_RETRIES:-5}"
      ETHERSCAN_RETRY_BASE_MS: "${ETHERSCAN_RETRY_BASE_MS:-1000}"
      ETHERSCAN_HTTP_TIMEOUT_SECONDS: "${ETHERSCAN_HTTP_TIMEOUT_SECONDS:-120}"
      ETHEREUM_RPC_URL: "${ETHEREUM_RPC_URL:-}"
      BASE_RPC_URL: "${BASE_RPC_URL:-}"
      ETHEREUM_BRIDGE_CONFIRMATIONS: "${ETHEREUM_BRIDGE_CONFIRMATIONS:-12}"
      BASE_BRIDGE_CONFIRMATIONS: "${BASE_BRIDGE_CONFIRMATIONS:-20}"
      BRIDGE_SYNC_INTERVAL_SECONDS: "${BRIDGE_SYNC_INTERVAL_SECONDS:-60}"
      BRIDGE_SYNC_BATCH_SIZE: "${BRIDGE_SYNC_BATCH_SIZE:-50}"
      BRIDGE_SYNC_MAX_RETRIES: "${BRIDGE_SYNC_MAX_RETRIES:-8}"
      BRIDGE_SYNC_MAX_CONCURRENCY: "${BRIDGE_SYNC_MAX_CONCURRENCY:-2}"
      WEB_DIST_DIR: "/app/web/dist"
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
