services:
  app:
    profiles: ["app"]
    build: .
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      HTTP_AUTH_DISABLED: "${HTTP_AUTH_DISABLED:-false}"
      HTTP_API_KEY: "${HTTP_API_KEY:-}"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "${MONGO_DATABASE:-eth_fund_trace}"
      ETHERSCAN_API_KEY: "${ETHERSCAN_API_KEY:-}"
      ETHERSCAN_BASE_URL: "${ETHERSCAN_BASE_URL:-https://api.etherscan.io/v2/api}"
      ETHERSCAN_PAGE_SIZE: "${ETHERSCAN_PAGE_SIZE:-1000}"
      ETHERSCAN_MAX_PAGES: "${ETHERSCAN_MAX_PAGES:-10}"
      ETHERSCAN_REQUESTS_PER_SECOND: "${ETHERSCAN_REQUESTS_PER_SECOND:-3}"
      ETHERSCAN_BURST: "${ETHERSCAN_BURST:-1}"
      ETHERSCAN_MAX_RETRIES: "${ETHERSCAN_MAX_RETRIES:-5}"
      ETHERSCAN_RETRY_BASE_MS: "${ETHERSCAN_RETRY_BASE_MS:-1000}"
      ETHERSCAN_HTTP_TIMEOUT_SECONDS: "${ETHERSCAN_HTTP_TIMEOUT_SECONDS:-120}"
      SYNC_CACHE_TTL_MINUTES: "${SYNC_CACHE_TTL_MINUTES:-15}"
      SYNC_CONFIRMATIONS: "${SYNC_CONFIRMATIONS:-12}"
      SYNC_QUEUE_SIZE: "${SYNC_QUEUE_SIZE:-100}"
      SYNC_MAX_RECORDS_PER_ACTION: "${SYNC_MAX_RECORDS_PER_ACTION:-50000}"
      TRACE_EXISTING_DATA_ONLY: "${TRACE_EXISTING_DATA_ONLY:-false}"
      ETHEREUM_SYNC_START_BLOCK: "${ETHEREUM_SYNC_START_BLOCK:-21525891}"
      ETHEREUM_SYNC_END_BLOCK: "${ETHEREUM_SYNC_END_BLOCK:-25860787}"
      ETHEREUM_RPC_URL: "${ETHEREUM_RPC_URL:-}"
      WEB_DIST_DIR: "/app/web/dist"
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:8.2
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
